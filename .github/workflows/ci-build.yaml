name: Build and Push to OCI

# Trigger this workflow on pushes or pull requests to the "devops" branch
on:
  push:
    branches: [ "devops" ]
  pull_request:
    branches: [ "devops" ]

jobs:
  build-and-push:
    # You can use 'ubuntu-latest' or a self-hosted runner if you have one set up
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Generate a unique timestamp tag
      - name: Generate Docker image tag
        id: gen-tag
        run: |
          BUILD_TAG=$(date +'%Y%m%d%H%M%S')
          echo "BUILD_TAG=$BUILD_TAG" >> $GITHUB_ENV

      # 3. Log in to OCI Registry
      - name: OCI Registry Login
        run: |
          echo "${{ secrets.OCI_AUTH_TOCKEN }}" | docker login \
            uk-london-1.ocir.io \
            -u "${{ secrets.OCI_USERNAME }}" \
            --password-stdin

      # 4. Build Docker image using the Dockerfile in the repo root
      - name: Build Docker image
        run: |
          echo "Building image with tag: ${{ env.BUILD_TAG }}"
          docker build -t uk-london-1.ocir.io/axoljy8w1ft0/dadesk-shared-devops/jmagick:${{ env.BUILD_TAG }} .

      # 5. Push Docker image to OCI
      - name: Push Docker image
        run: |
          echo "Pushing image: uk-london-1.ocir.io/axoljy8w1ft0/dadesk-shared-devops/jmagick:${{ env.BUILD_TAG }}"
          docker push uk-london-1.ocir.io/axoljy8w1ft0/dadesk-shared-devops/jmagick:${{ env.BUILD_TAG }